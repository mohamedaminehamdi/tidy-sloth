name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: pages
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The site is the demo, the installer, and the wheel the installer installs (no git needed on the user's Mac).
      - run: uv build --wheel
      - run: mkdir _site && cp -R tidy_sloth/web/. _site/ && cp install.sh dist/tidy_sloth-0.1.0-py3-none-any.whl _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
